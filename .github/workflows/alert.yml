name: FNO News Alert

on:
  schedule:
    # Times in UTC. IST = UTC + 5:30.
    # 04:00 UTC = 9:30 IST | 07:00 = 12:30 IST | 10:00 = 15:30 IST
    # 13:00 UTC = 18:30 IST | 16:00 = 21:30 IST
    - cron: "0 4,7,10,13,16 * * 1-5"   # weekdays only
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated seen_ids.json

jobs:
  run-alert-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated dedup state
        run: |
          git config user.name "fno-alert-bot"
          git config user.email "actions@github.com"
          git add data/seen_ids.json
          git diff --cached --quiet || git commit -m "Update seen-items state [skip ci]"
          git push
