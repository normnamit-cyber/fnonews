name: FNO News Alert

on:
  schedule:
    # All times below are UTC. IST = UTC + 5:30.
    # Market-hours checks every ~90 minutes, a 3pm final/recap report,
    # and a post-market check around 8pm for after-hours announcements.
    - cron: "0 4 * * 1-5"     # 09:30 IST
    - cron: "30 5 * * 1-5"    # 11:00 IST
    - cron: "0 7 * * 1-5"     # 12:30 IST
    - cron: "30 8 * * 1-5"    # 14:00 IST
    - cron: "30 9 * * 1-5"    # 15:00 IST — Final Report + Full-Day Recap
    - cron: "30 14 * * 1-5"   # 20:00 IST — Post-Market Update
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated seen_ids.json

jobs:
  run-alert-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated dedup state
        run: |
          git config user.name "fno-alert-bot"
          git config user.email "actions@github.com"
          git add data/seen_ids.json
          git diff --cached --quiet || git commit -m "Update seen-items state [skip ci]"
          git push
